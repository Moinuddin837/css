<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
*
        {
        margin: 0px;
        padding: 0px;
         box-sizing:border-box;
        }
        .container 
        {
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 80%;
          min-height: 100vh;
          margin: auto;
        }
        .left 
        {
            width: 50%;
        }
       .left  h1 {
        color: blue;
        font-size: 45px;
        margin-bottom:10px;
        font-family: Arial, Helvetica, sans-serif;
        }
        .left p
           {
            font-size: 24px;
            margin-top: 10px;
           }
        .right
        { 
           display: flex;
           flex-direction: column;
           justify-content: space-around;
            width:350px;
            border-radius: 8px;
            background-color:white;
            margin: 10px;
            text-align: center;
            padding: 20px;
        }
        .right:hover
        {
            box-shadow: 5px 5px 1px grey
        }
        .right input 
        {   
            border-radius: 10px white;
            color: black;
            width: 100%;
            height: 50%;
            margin-bottom:12px;
            padding:12px;
            
        }
       .btn
       {
        border-radius: 6px;
        background-color: blue;
        color: white;
        font-weight: bold;
        width: 100%;
        height: 50%;
        font-size: 18px;
        padding: 10px 12px;
       }
       .forget 
       {
        text-align: center;
        color: blue;
        margin: 8px;
        font-size: 20px;
        padding: 5px;
       }
       .login-btn 
       {
          border-radius: 8px;
          font-size: 18px;
          background-color: rgb(37, 163, 37);
          color: white;
          padding:15px 10px;
          margin-top: 25px;
           margin-bottom: 10px;
           margin-left: 40px;
           margin-right: 40px;
       }
    </style>
</head>
<body style="background-color: rgb(207, 198, 198);">
   <div class="container">
    <div class="left">
        <h1>Facebook</h1>
        <p>Connect with friends and the world <br> around you  on Facebook.</p>
    </div>
       <div class="right">
        <input type="text"  placeholder="Email or phone number"   name="Email">
        <input type="password" placeholder="Password">
        <button class="btn">Login</button>
        <p class="forget">forget password?</p>
        <hr>
        <button class="login-btn">Create new account</button>
    </div>
   </div>
</body>
</html>
